replicaCount: 1
drupalSecretName: drupal-passwords-v2
drupalSecretPasswordKey: drupal-password
drupalUsername: admin

# 1. Корневой блок (для совместимости)
auth:
  existingSecret: drupal-passwords-v2
  passwordKey: drupal-password
  databasePasswordKey: mariadb-password

drupal:
  global:
    imageRegistry: docker.io
    security:
      allowInsecureImages: true
  image:
    registry: docker.io
    repository: bitnamilegacy/drupal
    tag: 11.2.3-debian-12-r1

  # СКРИПТ ОЖИДАНИЯ ГОТОВНОСТИ БАЗЫ ДАННЫХ
  initContainers:
    - name: wait-for-db
      image: docker.io/bitnamilegacy/os-shell:latest
      command:
        - /bin/bash
        - -ec
        - |
          echo "Waiting for MariaDB to be ready at drupal-helm-app-mariadb.drupal-prod.svc.cluster.local:3306..."
          until timeout 1 bash -c 'cat < /dev/null > /dev/tcp/drupal-helm-app-mariadb.drupal-prod.svc.cluster.local/3306' 2>/dev/null; do
            echo "Database is not reachable yet. Sleeping 5 seconds..."
            sleep 5
          done
          echo "MariaDB is UP and running!"
          
  # УВЕЛИЧИВАЕМ ТАЙМАУТЫ СТАРТА ПРИЛОЖЕНИЯ
  readinessProbe:
    enabled: true
    initialDelaySeconds: 180  # Ждать ровно 3 минуты перед первой проверкой порта
    periodSeconds: 10         # Опрашивать каждые 10 секунд
    failureThreshold: 15      # Позволить упасть 15 раз подряд, прежде чем убить контейнер

  livenessProbe:
    enabled: true
    initialDelaySeconds: 240  # Дать 4 минуты на запуск, прежде чем перезапускать под
    periodSeconds: 15
    failureThreshold: 8

  # 2. Блок авторизации самого приложения Drupal
  auth:
    existingSecret: drupal-passwords-v2
    passwordKey: drupal-password
    databasePasswordKey: mariadb-password # Используем mariadb-password
    username: bn_drupal                    # Подключаемся как bn_drupal
    database: bitnami_drupal

  persistence:
    enabled: false
  volumePermissions:
    enabled: false
  service:
    type: ClusterIP
    ports:
      http: 8080

  # 3. Конфигурация субчарта базы данных MariaDB
  mariadb:
    enabled: true
    auth:
      existingSecret: drupal-passwords-v2
      rootPasswordKey: mariadb-root-password
      passwordKey: mariadb-password
      username: bn_drupal                  # Системный пользователь базы
      database: bitnami_drupal              # Имя создаваемой базы данных
    persistence:
      enabled: false
    volumePermissions:
      enabled: false
    primary:
      replicaCount: 1
      auth:
        existingSecret: drupal-passwords-v2
        rootPasswordKey: mariadb-root-password
        passwordKey: mariadb-password
        username: bn_drupal
        database: bitnami_drupal
      persistence:
        enabled: false
    image:
      registry: docker.io
      repository: bitnamilegacy/mariadb
      tag: 12.0.2-debian-12-r0
    osShell:
      image:
        registry: docker.io
        repository: bitnamilegacy/os-shell
