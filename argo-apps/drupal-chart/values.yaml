# Имя существующего секрета, который будет создан из SealedSecret
replicaCount: 1
drupalSecretName: drupal-passwords-v2
drupalSecretPasswordKey: drupal-password
drupalUsername: admin

# Использование существующего секрета для самого Drupal
auth:
  existingSecret: drupal-passwords-v2
  passwordKey: drupal-password

# Заставляем поды Drupal ждать готовности прокси-сети Istio
#podAnnotations:
  #proxy.istio.io/config: '{ "holdApplicationUntilProxyStarts": true }'

global:
  imageRegistry: docker.io
  security:
    allowInsecureImages: true

image:
  registry: docker.io
  repository: bitnamilegacy/drupal
  tag: 11.2.3-debian-12-r1

persistence:
  enabled: false

volumePermissions:
  enabled: false
  image:
    registry: docker.io
    repository: bitnamilegacy/os-shell

service:
  type: ClusterIP
  ports:
    http: 8080 # Стандартный порт контейнера Bitnami Drupal

# Конфигурация базы данных MariaDB
mariadb:
  auth:
    existingSecret: drupal-passwords-v2
    passwordKey: mariadb-password
    rootPasswordKey: mariadb-root-password
  primary:
    replicaCount: 1
  #podAnnotations:
    #proxy.istio.io/config: '{ "holdApplicationUntilProxyStarts": true }'
    persistence:
      enabled: false
  image:
    registry: docker.io
    repository: bitnamilegacy/mariadb
    tag: 12.0.2-debian-12-r0
  osShell:
    image:
      registry: docker.io
      repository: bitnamilegacy/os-shell
  volumePermissions:
    enabled: false
