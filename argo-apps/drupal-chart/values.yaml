# Имя существующего секрета, который будет создан из SealedSecret
replicaCount: 1
drupalSecretName: drupal-passwords-v2
drupalSecretPasswordKey: drupal-password
drupalUsername: admin

# Обертка для параметров родительского/дочернего чарта Drupal от Bitnami
drupal:
  auth:
    existingSecret: drupal-passwords-v2
    passwordKey: drupal-password
  persistence:
    enabled: false          # <-- ТЕПЕРЬ ДИСКИ ОТКЛЮЧЕНЫ ДЛЯ DRUPAL
  volumePermissions:
    enabled: false

global:
  imageRegistry: docker.io
  security:
    allowInsecureImages: true

image:
  registry: docker.io
  repository: bitnamilegacy/drupal
  tag: 11.2.3-debian-12-r1

service:
  type: ClusterIP
  ports:
    http: 8080

# Конфигурация базы данных MariaDB (Она идет независимо внутри Bitnami-чарта)
mariadb:
  auth:
    existingSecret: drupal-passwords-v2
    passwordKey: mariadb-password
    rootPasswordKey: mariadb-root-password
  primary:
    replicaCount: 1
    persistence:
      enabled: false        # <-- ТЕПЕРЬ ДИСКИ ОТКЛЮЧЕНЫ ДЛЯ БАЗЫ ДАННЫХ
  image:
    registry: docker.io
    repository: bitnamilegacy/mariadb
    tag: 12.0.2-debian-12-r0
  osShell:
    image:
      registry: docker.io
      repository: bitnamilegacy/os-shell
  volumePermissions:
    enabled: false
