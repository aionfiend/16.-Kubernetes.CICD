replicaCount: 1
drupalSecretName: drupal-passwords-v2
drupalSecretPasswordKey: drupal-password
drupalUsername: admin

# ВСЕ настройки для дочернего чарта Bitnami Drupal должны быть ЗДЕСЬ:
drupal:
  global:
    imageRegistry: docker.io
    security:
      allowInsecureImages: true
  image:
    registry: docker.io
    repository: bitnamilegacy/drupal  # Используем архивный рабочий репозиторий Bitnami
    tag: 11.2.3-debian-12-r1         # Актуальный и существующий тег
  auth:
    existingSecret: drupal-passwords-v2
    passwordKey: drupal-password
  persistence:
    enabled: false
  volumePermissions:
    enabled: false
  service:
    type: ClusterIP
    ports:
      http: 8080

# Конфигурация базы данных MariaDB (Остается без изменений)
mariadb:
  auth:
    existingSecret: drupal-passwords-v2
    passwordKey: mariadb-password
    rootPasswordKey: mariadb-root-password
  primary:
    replicaCount: 1
    persistence:
      enabled: false
  image:
    registry: docker.io
    repository: bitnamilegacy/mariadb
    tag: 12.0.2-debian-12-r0
  osShell:
    image:
      registry: docker.io
      repository: bitnamilegacy/os-shell
  volumePermissions:
    enabled: false
