apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: drupal-helm-app
  namespace: argocd
spec:
  project: default
  # ИСПОЛЬЗУЕМ ОДИН СТАБИЛЬНЫЙ ИСТОЧНИК ВМЕСТО BLOKA SOURCES
  source:
    repoURL: https://github.com/aionfiend/16.-Kubernetes.CICD
    targetRevision: main
    path: drupal-chart
    helm:
      valueFiles:
        - values.yaml
      values: |
        db:
          password: ""
          root_password: ""
          existingSecret: "drupal-passwords-v2"
        podAnnotations:
          proxy.istio.io/config: '{ "holdApplicationUntilProxyStarts": true }'

  destination:
    server: 'https://kubernetes.default.svc'
    namespace: drupal-prod

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
