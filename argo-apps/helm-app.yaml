apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: drupal-helm-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com
    targetRevision: main
    path: argo-apps/drupal-chart
    helm:
      valueFiles:
        - values.yaml
      # ПРИНУДИТЕЛЬНОЕ ПЕРЕОПРЕДЕЛЕНИЕ СЕКРЕТОВ (ДОБАВИТЬ ЭТОТ БЛОК):
      values: |
        auth:
          existingSecret: drupal-passwords-v2
          passwordKey: drupal-password
          databasePasswordKey: mariadb-password
        externalDatabase:
          existingSecret: drupal-passwords-v2
          existingSecretPasswordKey: mariadb-password
        drupal:
          auth:
            existingSecret: drupal-passwords-v2
            passwordKey: drupal-password
            databasePasswordKey: mariadb-password
          externalDatabase:
            existingSecret: drupal-passwords-v2
            existingSecretPasswordKey: mariadb-password
          mariadb:
            auth:
              existingSecret: drupal-passwords-v2
              passwordKey: mariadb-password
              rootPasswordKey: mariadb-root-password
            primary:
              auth:
                existingSecret: drupal-passwords-v2
                passwordKey: mariadb-password

  destination:
    server: 'https://default.svc'
    namespace: drupal-prod

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
